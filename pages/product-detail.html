<!doctype html>
<!-- data-base: prefix path gambar (lihat js/ui.js) -->
<html lang="id" data-base="../">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Produk — Fawnia Shop</title>
    <link rel="icon" href="../assets/img/fawnia-logo.png" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/landing.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../index.html"
          ><span class="brand-mark">F</span
          ><span class="brand-name">fawnia</span></a
        >
        <nav
          class="desktop-nav"
          style="padding-bottom: 0; justify-content: flex-start"
        >
          <a class="nav-link" href="../index.html">Home</a>
          <a class="nav-link" href="../index.html#products">Produk</a>
          <a class="nav-link" href="../index.html#shipping">Pengiriman</a>
          <a class="nav-link" href="../index.html#payment">Pembayaran</a>
          <a class="nav-link" href="checkout.html">Checkout</a>
          <a class="nav-link active" href="account.html">Akun</a>
        </nav>
        <div class="header-actions">
          <button
            type="button"
            class="icon-btn"
            data-cart-open
            aria-label="Buka keranjang"
          >
            <i data-lucide="shopping-cart"></i>
            <span class="cart-badge" data-cart-count style="display: none"
              >0</span
            >
          </button>
          <a class="header-cta" href="../index.html#checkout">Checkout</a>
        </div>
      </div>
    </header>

    <main class="section detail-page">
      <div class="container" id="detail"></div>
    </main>

    <div id="cart-drawer" class="cart-drawer-root" aria-hidden="true"></div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button id="close-lightbox" aria-label="Tutup">
        <i data-lucide="x"></i>
      </button>
      <img id="lightbox-img" src="" alt="" />
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/pages/product-detail.js"></script>
  </body>
</html>
